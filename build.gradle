// Top-level build file. Plugin versions live here; repositories are declared
// once in settings.gradle (dependencyResolutionManagement), so no
// allprojects/buildscript repository blocks (they conflict with
// RepositoriesMode.FAIL_ON_PROJECT_REPOS).
plugins {
    id("com.android.application") version '8.13.2' apply false
    id("org.jetbrains.kotlin.android") version "1.9.24" apply false
}
